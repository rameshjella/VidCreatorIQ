services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./workspace:/app/workspace
      - ./ai_movie_maker.db:/app/ai_movie_maker.db
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - VITE_API_BASE_URL=http://api:8000
    depends_on:
      - api

